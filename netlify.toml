# Configuration Netlify.
# Site relié à GitHub : la commande crée config.js à partir des variables
# SUPABASE_URL et SUPABASE_ANON_KEY définies dans Netlify.
# Dépôt par glisser-déposer : lancer node outils/generer-config.js avant.
[build]
  publish = "."
  command = "node outils/generer-config.js"

# Fichiers qui ne doivent pas être servis
[[redirects]]
  from = "/.env"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/outils/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/public/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/prof.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
